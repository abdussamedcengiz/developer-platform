<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Abdüssamed Cengiz — Yazılım Mühendisi</title>
    <meta
      name="description"
      content="Yazılım mühendisi. TypeScript, React, React Native ve Node.js ile web ve mobil uygulamalar geliştiriyorum. Projelerim ve yazılarım."
    />
    <meta name="author" content="Abdüssamed Cengiz" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tarayici arayuzunu (mobilde adres cubugu) sayfayla ayni renge boyar.
         Iki ayri etiket: kullanicinin temasina gore biri devreye girer. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#020617"
    />

    <!-- Open Graph: baglanti WhatsApp, LinkedIn, X gibi yerlerde
         paylasilinca gosterilecek onizleme bilgileri. -->
    <meta property="og:title" content="Abdüssamed Cengiz — Yazılım Mühendisi" />
    <meta
      property="og:description"
      content="TypeScript, React, React Native ve Node.js ile web ve mobil uygulamalar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />

    <!-- FONTLAR
         preconnect: tarayici DNS + TLS el sikismasini font dosyasi
         istenmeden ONCE yapar, birkac yuz ms kazandirir.
         display=swap: font inerken yazi gorunmez kalmaz, once yedek
         font ile cizilir (FOIT yerine FOUT). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      FOUC (Flash of Unstyled Content) onleme.

      React yuklenmesi birkac yuz milisaniye surer. O sure boyunca
      sayfa BEYAZ olur; koyu tema kullanicisi her yenilemede
      goz alici bir beyaz parlama gorur.

      Bu script React'ten ONCE, senkron calisir ve dogru sinifi
      hemen ekler. Tema mantiginin tek yerde olmamasi bir odun,
      ama karsiliginda kullanici deneyimi duzeliyor.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("dp_theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* localStorage kapaliysa sessizce gec */
        }
      })();
    </script>
  </head>
  <body>
    <!-- React'in icini dolduracagi tek kutu. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
